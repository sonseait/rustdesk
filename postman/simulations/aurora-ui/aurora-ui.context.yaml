assumptions:
  - id: configured-server-without-agent-reports
    status: supported
    claim: Current server configuration can be present while the server-nodes endpoint returns an empty list; the UI must still display the configured connection details.
    reason: Configuration and node reports are separate API resources. The live portal showed revision 2 with zero node reports, and the real frontend rendered configuration through the existing simulation with an empty nodes response.
    verification: On 2026-11-04, rendered Server nodes with empty=true; hbbs, hbbr, public key, mode and desired revision remained visible with an explicit first-report notice. Injected server-nodes HTTP 503 while configuration stayed HTTP 200; the configuration remained visible and the nodes panel exposed its error and retry action. Removing the fault restored the page through polling. Default healthy/unhealthy node fixtures still displayed their effective revisions and rollout results. Request events were confirmed in the local simulation log. These checks do not establish live agent health or rollout behavior.
    source: controlplane-ui/src/pages/ServerNodesPage.tsx; controlplane-api/crates/api/src/main.rs server_nodes; postman/mocks/aurora-ui/default.js
    updated_at: "2026-11-04"
  - id: frontend-response-shapes
    status: supported
    claim: The frontend consumes the response fields modeled by this fixture on the routes exercised during visual review.
    reason: Field shapes were inspected in the local API transport types and OpenAPI contract; the real frontend rendered these synthetic responses through HTTP.
    verification: On 2026-11-04, all seven UI routes rendered against the local simulation; device restore, enrollment token creation, policy save and configuration publication updated visible state. This establishes compatibility with these fixtures, not live authorization or device behavior.
    source: controlplane-ui/src/api.ts; controlplane-ui/src/api.generated.ts; controlplane-api/openapi.yaml; docs/design/aurora-control-plane/evidence.json; docs/design/aurora-control-plane/http-observations.json
    updated_at: "2026-11-04"
