    reason: The fixture deliberately omits credential validation and real device/node operations. No authenticated live API was used for this UI task. The owner-mock search was skipped because the CLI was signed out.
    verification: Not established by visual review. Validate live operations in the API integration workflow before relying on this fixture for release guarantees.
    source: postman/mocks/aurora-ui/default.js; docs/design/aurora-control-plane/README.md
    updated_at: "2026-11-04"

