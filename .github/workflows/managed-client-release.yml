name: Managed Client Release

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: managed-client-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows client
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    env:
      MANAGED_CP_URL: ${{ secrets.MANAGED_CP_URL }}
      MANAGED_CP_CONFIG_PUBLIC_KEY: ${{ secrets.MANAGED_CP_CONFIG_PUBLIC_KEY }}
      MANAGED_BOOTSTRAP_TOKEN: ${{ secrets.MANAGED_BOOTSTRAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Preserve local build output; clean everything else explicitly below.
          # Only run trusted code on this persistent self-hosted runner.
          clean: false
      - name: Clean workspace except incremental build output
        working-directory: ${{ github.workspace }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git clean -ffdx -e /desktop/target/ -e /desktop/flutter/build/ -e /desktop/flutter/.dart_tool/ -e /desktop/flutter/windows/flutter/ephemeral/
      - name: Select Git Bash for setup actions
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $gitExecPath = (& git --exec-path).Trim()
          $gitBin = [System.IO.Path]::GetFullPath((Join-Path $gitExecPath '../../../bin'))
          $gitBash = Join-Path $gitBin 'bash.exe'
          if (!(Test-Path $gitBash)) {
            throw 'Git Bash was not found. Install Git for Windows and restart the runner service.'
          }
          Write-Host "Using Git Bash: $gitBash"
          & $gitBash --version
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install jq for Flutter setup
        run: |
          $toolsRoot = $env:RUNNER_TOOL_CACHE
          if (!$toolsRoot) {
            $toolsRoot = Join-Path $env:RUNNER_TEMP 'tools'
          }
          $jqDir = Join-Path $toolsRoot 'jq/1.8.1/x64'
          $jqExe = Join-Path $jqDir 'jq.exe'
          $expectedHash = '23cb60a1354eed6bcc8d9b9735e8c7b388cd1fdcb75726b93bc299ef22dd9334'
          New-Item -ItemType Directory -Force $jqDir | Out-Null
          if (!(Test-Path $jqExe) -or (Get-FileHash $jqExe -Algorithm SHA256).Hash -ne $expectedHash) {
            Invoke-WebRequest -Uri 'https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-windows-amd64.exe' -OutFile $jqExe
          }
          if ((Get-FileHash $jqExe -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'The downloaded jq executable failed SHA-256 verification.'
          }
          & $jqExe --version
          $jqDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify jq is available to Git Bash
        shell: bash
        run: jq --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          # The SDK in RUNNER_TOOL_CACHE and the user's Pub cache persist locally.
          cache: false
      - name: Configure Windows native dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (!$env:RUNNER_TOOL_CACHE) {
            throw 'RUNNER_TOOL_CACHE must point to persistent storage on the self-hosted runner.'
          }
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $revision = $manifest.'vcpkg-configuration'.'default-registry'.baseline
          if ($revision -notmatch '^[0-9a-f]{40}$') {
            throw 'vcpkg.json must specify a full vcpkg baseline commit.'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsRoot) {
            throw 'Visual Studio C++ build tools were not found.'
          }
          $toolset = (Get-Content (Join-Path $vsRoot 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          # Version the local installation when the baseline, toolset or codec options change.
          $nativeKey = "vcpkg-$revision-msvc-$toolset-x64-windows-static-v1"
          $vcpkgRoot = Join-Path $env:RUNNER_TOOL_CACHE "managed-client/$env:GITHUB_REPOSITORY/$nativeKey"
          Write-Host "Persistent native dependencies: $vcpkgRoot"
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VS_INSTALL_ROOT=$vsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_REVISION=$revision" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure libclang for Windows Rust bindings
        run: '& "$env:GITHUB_WORKSPACE/.github/scripts/setup-windows-libclang.ps1"'
      - name: Ensure Windows native codec dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force $env:VCPKG_ROOT | Out-Null
          if (!(Test-Path (Join-Path $env:VCPKG_ROOT '.git'))) {
            git -C $env:VCPKG_ROOT init
          }
          # Idempotent even if a previous run stopped during setup.
          git -C $env:VCPKG_ROOT config remote.origin.url https://github.com/microsoft/vcpkg
          $head = $null
          if (Test-Path (Join-Path $env:VCPKG_ROOT '.git/index')) {
            $head = & git -C $env:VCPKG_ROOT rev-parse --verify HEAD
          }
          if ($head -ne $env:VCPKG_REVISION) {
            git -C $env:VCPKG_ROOT fetch --depth 1 origin $env:VCPKG_REVISION
            git -C $env:VCPKG_ROOT checkout --detach FETCH_HEAD
          }
          if (!(Test-Path (Join-Path $env:VCPKG_ROOT 'vcpkg.exe'))) {
            & (Join-Path $env:VCPKG_ROOT 'bootstrap-vcpkg.bat') -disableMetrics
          }
          Push-Location $env:VCPKG_ROOT
          try {
            # Already installed packages are a no-op; interrupted installs can resume.
            & .\vcpkg.exe install --classic libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
          } finally {
            Pop-Location
          }
      - name: Fetch Flutter dependencies
        run: flutter pub get
        working-directory: desktop/flutter
      - name: Build managed Windows Rust library
        run: cargo build --locked --release --lib --features flutter,managed-only
      - name: Build managed Windows Flutter application
        run: flutter build windows --release --no-pub
        working-directory: desktop/flutter
      - name: Package Windows release
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE/.github/scripts/package-managed-windows.py" flutter/build/windows/x64/runner/Release
          if ($LASTEXITCODE -ne 0) { throw 'Managed Windows setup packaging failed' }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/flutter/build/windows/x64/runner/Release/Setup.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          Compress-Archive -Path 'flutter/build/windows/x64/runner/Release/*' -DestinationPath "$env:GITHUB_WORKSPACE/rustdesk-managed-windows-x64.zip"
      - name: Build Windows setup executable
        shell: pwsh
        run: |
          $innoDir = Join-Path $env:RUNNER_TOOL_CACHE 'managed-client/innosetup-6.4.3'
          $compiler = Join-Path $innoDir 'ISCC.exe'
          if (!(Test-Path $compiler)) {
            $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3.exe'
            Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $installer
            $expectedHash = 'f3c42116542c4cc57263c5ba6c4feabfc49fe771f2f98a79d2f7628b8762723b'
            if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expectedHash) {
              throw 'Inno Setup download SHA-256 mismatch'
            }
            $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$innoDir`"") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
            if (!(Test-Path $compiler)) { throw 'Inno Setup compiler was not installed' }
          }
          $bundle = "$PWD/flutter/build/windows/x64/runner/Release"
          & $compiler "/DBundleDir=$bundle" "/DOutputDir=$env:GITHUB_WORKSPACE" "$env:GITHUB_WORKSPACE/desktop/res/managed-setup/managed-windows.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-managed-windows-x64
          path: |
            rustdesk-managed-windows-x64.zip
            rustdesk-managed-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish GitHub prerelease
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rustdesk-managed-windows-x64
          path: release-assets
      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: managed-client-${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Managed client $GITHUB_SHA" \
              --notes "Automated managed-client build for commit $GITHUB_SHA." \
              --prerelease
          fi
