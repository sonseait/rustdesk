name: Managed Client Release

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: managed-client-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows client
    runs-on: self-hosted
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      MANAGED_CP_URL: ${{ secrets.MANAGED_CP_URL }}
      MANAGED_CP_CONFIG_PUBLIC_KEY: ${{ secrets.MANAGED_CP_CONFIG_PUBLIC_KEY }}
      MANAGED_BOOTSTRAP_TOKEN: ${{ secrets.MANAGED_BOOTSTRAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Configure Windows native dependencies
        id: native-config
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $revision = $manifest.'vcpkg-configuration'.'default-registry'.baseline
          if ($revision -notmatch '^[0-9a-f]{40}$') {
            throw 'vcpkg.json must specify a full vcpkg baseline commit.'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsRoot) {
            throw 'Visual Studio C++ build tools were not found.'
          }
          $toolset = (Get-Content (Join-Path $vsRoot 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "toolset=$toolset" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Cache Windows native codecs
        id: native-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg/installed
          # Bump the suffix when changing the codec list or build options.
          key: windows-2022-${{ runner.arch }}-vcpkg-${{ steps.native-config.outputs.revision }}-msvc-${{ steps.native-config.outputs.toolset }}-x64-windows-static-v1
      - name: Install Windows native codec dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          VCPKG_REVISION: ${{ steps.native-config.outputs.revision }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force $env:VCPKG_ROOT | Out-Null
          git -C $env:VCPKG_ROOT init
          git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg
          git -C $env:VCPKG_ROOT fetch --depth 1 origin $env:VCPKG_REVISION
          git -C $env:VCPKG_ROOT checkout --detach FETCH_HEAD
          & (Join-Path $env:VCPKG_ROOT 'bootstrap-vcpkg.bat') -disableMetrics
          Push-Location $env:VCPKG_ROOT
          & .\vcpkg.exe install --classic libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
          Pop-Location
      - name: Cache Windows Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: managed-windows-vcpkg-${{ steps.native-config.outputs.revision }}-msvc-${{ steps.native-config.outputs.toolset }}
          env-vars: VCPKG MANAGED_
          cache-workspace-crates: 'true'
      - name: Fetch Flutter dependencies
        run: flutter pub get
        working-directory: desktop/flutter
      - name: Build managed Windows Rust library
        run: cargo build --locked --release --lib --features flutter,managed-only
      - name: Build managed Windows Flutter application
        run: flutter build windows --release --no-pub
        working-directory: desktop/flutter
      - name: Package Windows release
        shell: pwsh
        run: |
          Compress-Archive -Path 'flutter/build/windows/x64/runner/Release/*' -DestinationPath "$env:GITHUB_WORKSPACE/rustdesk-managed-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-managed-windows-x64
          path: rustdesk-managed-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  build-macos:
    name: Build macOS client
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    env:
      MANAGED_CP_URL: ${{ secrets.MANAGED_CP_URL }}
      MANAGED_CP_CONFIG_PUBLIC_KEY: ${{ secrets.MANAGED_CP_CONFIG_PUBLIC_KEY }}
      MANAGED_BOOTSTRAP_TOKEN: ${{ secrets.MANAGED_BOOTSTRAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Install macOS native codec dependencies
        run: |
          vcpkg_root="$RUNNER_TEMP/vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg "$vcpkg_root"
          "$vcpkg_root/bootstrap-vcpkg.sh" -disableMetrics
          (
            cd "$vcpkg_root"
            ./vcpkg install libvpx:arm64-osx libyuv:arm64-osx opus:arm64-osx aom:arm64-osx
          )
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"
      - name: Fetch Flutter dependencies
        run: flutter pub get
        working-directory: desktop/flutter
      - name: Build managed macOS client
        run: |
          cargo build --release --lib --features flutter,managed-only
          cd flutter
          flutter build macos --release --no-pub
      - name: Package macOS release
        run: |
          cd flutter/build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent RustDesk.app "$GITHUB_WORKSPACE/rustdesk-managed-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-managed-macos-arm64
          path: rustdesk-managed-macos-arm64.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub prerelease
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rustdesk-managed-*
          path: release-assets
          merge-multiple: true
      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: managed-client-${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Managed client $GITHUB_SHA" \
              --notes "Automated managed-client build for commit $GITHUB_SHA." \
              --prerelease
          fi
