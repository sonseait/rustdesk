services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
  control-plane-api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      BIND_ADDR: 0.0.0.0:8080
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      postgres: { condition: service_healthy }
  portal:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes: [../cp-ui/dist:/usr/share/nginx/html:ro]
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: .env.production
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, ${NODE_AGENT_CA_FILE:?set NODE_AGENT_CA_FILE}:/etc/caddy/node-agent-ca.pem:ro, caddy-data:/data, caddy-config:/config]
    depends_on: [control-plane-api, portal]
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
