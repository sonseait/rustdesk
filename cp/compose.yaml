services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rustdesk_cp
      POSTGRES_USER: rustdesk
      POSTGRES_PASSWORD: rustdesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustdesk -d rustdesk_cp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
